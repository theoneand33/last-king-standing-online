<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last King Standing</title>
<meta name="description" content="An online card war for two to ten players. Keep your King alive.">
<meta name="theme-color" content="#1d5a3e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #1d5a3e; --felt-deep: #164a32; --felt-line: #2a6d4e; --rail: #4a2f1b; --rail-hi: #6b4528;
    --card: #fbfaf5; --card-edge: #d9d4c4; --ink: #1b1b1b; --red: #c3262e; --gold: #e3b24a; --gold-deep: #b5862a;
    --cream: #f3ecd6; --mute: #a8c6b5; --sel: #59c3ff;
    --sans: 'Inter', system-ui, sans-serif; --face: 'Libre Baskerville', Georgia, serif;
    --out: cubic-bezier(.2, .7, .2, 1); --in-out: cubic-bezier(.77, 0, .175, 1); --cw: 92px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--rail); color: var(--cream); font: 16px/1.45 var(--sans); }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  h1, h2 { margin: 0; }
  .crown { width: 1em; height: 1em; display: block; }
  .whisper { color: var(--mute); margin: 0; }
  .tiny { font-size: 12px; color: var(--mute); }
  .pill { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--felt-deep); color: var(--mute); white-space: nowrap; }
  .pill.hot { background: var(--gold); color: var(--ink); }

  /* top rail */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; background: var(--rail); border-bottom: 2px solid var(--rail-hi); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; min-width: 0; }
  .brand span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: var(--rail); font-size: 20px; }
  .top-r { display: flex; align-items: center; gap: 8px; }

  .btn { font: 600 15px/1 var(--sans); min-height: 44px; padding: 0 18px; border-radius: 99px; cursor: pointer; border: 0;
         transition: transform .12s var(--out), background-color .15s var(--out); }
  .btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--gold-deep); }
  .btn.gold:hover:not(:disabled) { transform: translateY(-1px); background: #ecc163; }
  .btn.gold:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }
  .btn.line { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 1.5px var(--felt-line); }
  .top .btn.line { box-shadow: inset 0 0 0 1.5px var(--rail-hi); }
  .btn.line:hover:not(:disabled) { background: rgb(255 255 255 / .06); }
  .btn.big { min-height: 54px; font-size: 18px; padding: 0 28px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
  #error { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 9; max-width: calc(100% - 32px);
           background: var(--card); color: var(--red); font-weight: 600; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgb(0 0 0 / .35); animation: pop .18s var(--out); }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -6px); } }

  /* felt */
  .felt { flex: 1; background: var(--felt); border: 10px solid var(--rail); border-top: 0; border-radius: 0 0 40px 40px; padding: 28px; position: relative; }
  .felt.center { display: grid; place-items: center; }

  /* browser */
  .opener { max-width: 1100px; margin: 0 auto 36px; }
  .opener h1 { font: 700 44px/1.1 var(--face); color: var(--cream); }
  .opener > p { color: var(--mute); margin: 8px 0 22px; font-size: 18px; }
  .newbar { display: grid; grid-template-columns: 1fr 1fr 110px auto; gap: 12px; align-items: end; padding: 16px; border-radius: 18px; background: var(--felt-deep); }
  .newbar label { display: grid; gap: 6px; font-size: 13px; color: var(--mute); }
  .newbar input, .newbar select { font: 16px var(--sans); min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--felt-line); background: var(--felt); color: var(--cream); }
  .newbar input::placeholder { color: var(--mute); opacity: .7; }
  .tables { max-width: 1100px; margin: 0 auto; }
  .tables h2 { font-size: 15px; font-weight: 600; color: var(--mute); margin-bottom: 14px; }
  .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .mini { display: grid; justify-items: center; gap: 14px; padding: 22px 18px 18px; border-radius: 18px; background: var(--felt-deep); text-align: center; transition: transform .15s var(--out); }
  .mini:hover { transform: translateY(-2px); }
  .mini-t b { display: block; font-size: 18px; }
  .mini-t span { font-size: 13px; color: var(--mute); }
  .mini .btn { width: 100%; }

  /* seat ring: seats sit on an ellipse */
  .ring { position: relative; border-radius: 50%; background: var(--felt); box-shadow: inset 0 0 0 6px var(--rail), inset 0 0 0 8px var(--rail-hi); }
  .ring.small { width: 150px; height: 96px; margin: 14px 0 12px; }
  .ring.big { position: absolute; inset: 0; background: transparent; box-shadow: none; }
  .seat { --a: calc(var(--i) / var(--n) * 360deg + 90deg); position: absolute; left: calc(50% + cos(var(--a)) * 54%); top: calc(50% + sin(var(--a)) * 60%);
          translate: -50% -50%; width: 26px; height: 26px; border-radius: 50%; border: 2px dashed var(--felt-line); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .seat.taken { border: 0; background: var(--gold); color: var(--ink); }
  .big .seat { width: 56px; height: 56px; font-size: 20px; left: calc(50% + cos(var(--a)) * 56%); top: calc(50% + sin(var(--a)) * 62%); }
  .oval { position: relative; width: min(640px, 80vw); aspect-ratio: 16 / 10; border-radius: 50%; background: var(--felt-deep); box-shadow: inset 0 0 0 2px var(--felt-line); display: grid; place-items: center; }
  .oval-c { position: relative; display: grid; justify-items: center; gap: 14px; text-align: center; padding: 20px; max-width: 70%; }

  /* playing cards */
  .pc { position: relative; width: var(--cw); aspect-ratio: 5 / 7; flex: none; padding: 0; font: inherit; color: var(--ink); background: var(--card);
        border: 1px solid var(--card-edge); border-radius: 9px; cursor: pointer; box-shadow: 0 2px 0 rgb(0 0 0 / .25), 0 6px 14px rgb(0 0 0 / .18);
        transition: transform .15s var(--out), box-shadow .15s var(--out); }
  @media (hover: hover) and (pointer: fine) { .pc:hover:not(:disabled) { transform: translateY(-3px); } }
  .pc.red { color: var(--red); }
  .pc .ix { position: absolute; display: grid; justify-items: center; line-height: 1; font-family: var(--face); }
  .pc .ix b { font-size: calc(var(--cw) * .2); } .pc .ix i { font-style: normal; font-size: calc(var(--cw) * .16); }
  .pc .ix .crown { width: calc(var(--cw) * .2); height: calc(var(--cw) * .2); }
  .pc .tl { top: 6px; left: 7px; } .pc .br { bottom: 6px; right: 7px; rotate: 180deg; }
  .pc .face { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .44); padding-bottom: 22%; }
  .pc .face .crown { width: calc(var(--cw) * .5); height: calc(var(--cw) * .5); }
  .pc .role { position: absolute; left: 0; right: 0; bottom: 30%; font-size: calc(var(--cw) * .11); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
  .pc .chips { position: absolute; left: 50%; bottom: -10px; translate: -50% 0; display: flex; gap: 3px; }
  .chip { font: 700 11px/1 var(--sans); padding: 4px 6px; border-radius: 99px; background: var(--ink); color: var(--card); white-space: nowrap; }
  .chip.kill { background: var(--red); animation: bump .2s var(--out); }
  @keyframes bump { from { scale: 1.35; } }
  .pc.king { color: var(--gold-deep); border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 2px 0 rgb(0 0 0 / .25), 0 6px 14px rgb(0 0 0 / .18); }
  .pc.sel { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--sel), 0 10px 18px rgb(0 0 0 / .3); }
  .pc.gap { visibility: hidden; }
  .pc.ghost { background: transparent; border: 2px dashed var(--felt-line); box-shadow: none; cursor: default; display: grid; place-items: center; color: var(--mute); font-size: 12px; font-weight: 600; }
  .pc.ghost.next { border-color: var(--gold); color: var(--gold); }
  .pc.land { animation: land .2s var(--out); cursor: default; }
  .pc.land:hover { transform: none; }
  @keyframes land { from { opacity: 0; transform: translateY(-14px) scale(1.04); } }
  .pc.sm { --cw: 54px; border-radius: 6px; }
  .pc.sm .role { display: none; } .pc.sm .br { display: none; }
  .pc.sm .face { font-size: 24px; padding: 18% 0 0; } .pc.sm .face .crown { width: 24px; height: 24px; }
  .pc.sm .chip { font-size: 9px; padding: 3px 4px; }

  /* setup */
  .setup { display: grid; grid-template-rows: 1fr auto; gap: 20px; padding-bottom: 0; }
  .lay { display: grid; justify-items: center; align-content: center; gap: 18px; }
  .formation { display: grid; grid-template-columns: repeat(3, var(--cw)); gap: 22px 16px; padding: 22px; border-radius: 20px; background: var(--felt-deep); }
  .muck { display: flex; align-items: center; gap: 8px; }
  .muck .pc.land { opacity: .6; }
  .hand-tray { margin: 0 -28px; padding: 18px 28px 22px; background: var(--felt-deep); border-top: 2px solid var(--felt-line); border-radius: 0 0 30px 30px; display: grid; justify-items: center; gap: 16px; }
  .hand { display: flex; justify-content: center; gap: 0; min-height: calc(var(--cw) * 1.4); }
  .hand .pc { margin: 0 -6px; animation: deal .3s var(--out) backwards; animation-delay: calc(var(--i, 0) * 50ms); }
  @keyframes deal { from { opacity: 0; transform: translateY(-24px) scale(.95); } }
  .tray-actions { display: flex; gap: 10px; }

  /* play */
  .table { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 18px 24px 22px; }
  .table > .opps { align-self: stretch; } .table > .mine { margin-top: auto; }
  .opps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 220px)); justify-content: center; gap: 16px; }
  .opp { padding: 12px; border-radius: 16px; background: var(--felt-deep); transition: box-shadow .2s var(--out); }
  .opp.turn { box-shadow: 0 0 0 2px var(--gold); }
  .opp.out { opacity: .5; }
  .opp header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; min-width: 0; }
  .opp header b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--cream); color: var(--felt-deep); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .mini-grid { display: grid; grid-template-columns: repeat(3, 54px); gap: 14px 8px; justify-content: center; padding-bottom: 6px; }
  .dealer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 10px 18px; border-radius: 99px; background: var(--card); color: var(--ink); animation: pop2 .2s var(--out); }
  .dealer.alarm { box-shadow: 0 0 0 3px var(--red); }
  @keyframes pop2 { from { opacity: 0; transform: scale(.96); } }
  .mine { padding: 22px 30px 28px; border-radius: 28px; border: 2px solid var(--felt-line); }
  .mine.turn { border-color: var(--gold); }
  .my-grid { display: grid; grid-template-columns: repeat(3, var(--cw)); gap: 24px 18px; --cw: 100px; }
  .moves { position: sticky; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 8px; border-radius: 99px; background: var(--rail); box-shadow: 0 8px 24px rgb(0 0 0 / .35); }
  .moves .hint { padding: 0 10px 0 12px; color: var(--cream); font-size: 14px; }
  .drawer { position: fixed; top: 62px; right: 16px; bottom: 16px; width: min(340px, calc(100% - 32px)); z-index: 5; overflow: auto; padding: 18px; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: 0 12px 40px rgb(0 0 0 / .4); animation: slide .22s var(--out); }
  .drawer h2 { font-size: 15px; margin-bottom: 10px; }
  .drawer ol { margin: 0 0 14px; padding-left: 20px; font-size: 14px; display: grid; gap: 6px; }
  .drawer .tiny { color: #666; }
  @keyframes slide { from { opacity: 0; transform: translateX(16px); } }

  @media (max-width: 820px) {
    .newbar { grid-template-columns: 1fr 1fr; } .newbar .btn { grid-column: 1 / -1; }
    .opps { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  }
  @media (max-width: 560px) {
    .felt { border-width: 0 6px 6px; padding: 18px 16px; border-radius: 0 0 24px 24px; }
    .top { padding: 8px 12px; } .top .pill { display: none; } .top .btn { padding: 0 12px; font-size: 14px; }
    .opener h1 { font-size: 32px; }
    .table { padding: 14px 12px 16px; }
    .opps { grid-template-columns: 1fr 1fr; gap: 10px; }
    .opp { padding: 10px 6px; } .mini-grid { grid-template-columns: repeat(3, 44px); gap: 12px 5px; } .pc.sm { --cw: 44px; } .pc.sm .face { font-size: 19px; }
    .mine { padding: 16px 14px 22px; } .my-grid { --cw: 84px; gap: 22px 12px; }
    .moves { border-radius: 18px; } .moves .hint { flex-basis: 100%; text-align: center; padding: 4px 0; }
    .hand { flex-wrap: wrap; row-gap: 18px; } .hand .pc { --cw: 72px; margin: 0 -4px; }
    .formation { --cw: 72px; gap: 18px 10px; padding: 16px; }
    .oval { width: 72vw; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="client.js"></script>
</body>
</html>
