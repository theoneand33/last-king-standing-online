<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last King Standing</title>
<meta name="description" content="An online card war for two to ten players. Keep your King alive.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f5f6f8, #111318); --surface: light-dark(#fff, #1a1d23); --soft: light-dark(#eef0f3, #252932);
    --line: light-dark(#dfe2e7, #2f343d); --text: light-dark(#16181d, #e8eaee); --mute: light-dark(#5f6672, #9aa1ad);
    --primary: light-dark(#2557d6, #5b8cff); --primary-hi: light-dark(#1d47b3, #7aa2ff); --on-primary: light-dark(#fff, #0b1020); --sel: var(--primary);
    --card: light-dark(#fff, #f6f6f3); --card-edge: light-dark(#d5d8de, #c9ccd2); --ink: #1b1b1b; --red: #c3262e; --gold: #d4a12a; --gold-deep: #a87c17; --gold-ink: #8f6416;
    --sans: 'Inter', system-ui, sans-serif; --face: 'Libre Baskerville', Georgia, serif;
    --out: cubic-bezier(.2, .7, .2, 1); --in-out: cubic-bezier(.77, 0, .175, 1); --cw: 92px;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--sans); }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  h1, h2 { margin: 0; font-weight: 600; }
  b { font-weight: 600; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .crown { width: 1em; height: 1em; display: block; }
  .whisper { color: var(--mute); margin: 0; }
  .tiny { font-size: 12px; color: var(--mute); }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--mute); white-space: nowrap; }
  .pill.hot { background: var(--primary); color: var(--on-primary); }

  /* header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; min-width: 0; }
  .brand h1 { font: inherit; min-width: 0; overflow-wrap: anywhere; }
  .logo { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-size: 16px; }
  .top-r { display: flex; align-items: center; gap: 8px; }

  .btn { font: 600 14px/1 var(--sans); min-height: 40px; padding: 0 16px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
         transition: background-color .15s var(--out), border-color .15s var(--out); }
  .btn.gold { background: var(--primary); color: var(--on-primary); }
  .btn.line { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.line[aria-pressed="true"] { background: var(--soft); }
  .btn.icon { width: 40px; padding: 0; display: grid; place-items: center; } .btn.icon svg { width: 18px; height: 18px; }
  .btn.big { min-height: 48px; font-size: 16px; padding: 0 24px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  @media (hover: hover) and (pointer: fine) {
    .btn.gold:hover:not(:disabled) { background: var(--primary-hi); }
    .btn.line:hover:not(:disabled) { background: var(--soft); }
  }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  #error { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 9; max-width: calc(100% - 32px);
           background: var(--surface); color: var(--red); border: 1px solid var(--line); font-weight: 600; padding: 10px 12px 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgb(0 0 0 / .15); animation: pop .18s var(--out); display: flex; align-items: center; gap: 12px; }
  #error[hidden] { display: none; }
  #error .x { flex: none; min-width: 32px; min-height: 32px; border: 0; border-radius: 6px; background: none; color: inherit; font: 500 20px/1 var(--sans); cursor: pointer; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -6px); } }

  /* page body */
  .main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  .main.center { display: grid; place-items: center; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }

  /* game list */
  .opener { margin-bottom: 32px; }
  .opener h2 { font-size: 28px; line-height: 1.2; }
  .opener > p { color: var(--mute); margin: 8px 0 20px; }
  .newbar { display: grid; grid-template-columns: 1fr 1fr 112px auto; gap: 12px; align-items: end; padding: 16px; }
  .newbar label, .field { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--mute); }
  .newbar input, .newbar select { font: 16px var(--sans); min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 100%; min-width: 0; }
  .newbar input::placeholder { color: var(--mute); opacity: 1; }
  .tables h2 { font-size: 15px; color: var(--mute); margin-bottom: 12px; }
  .game-list { list-style: none; margin: 0; padding: 0; }
  .game-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; }
  .game-row + .game-row { border-top: 1px solid var(--line); }
  .game-row div { flex: 1; min-width: 0; }
  .game-row b { display: block; overflow-wrap: anywhere; }
  .game-row span.meta { font-size: 13px; color: var(--mute); }

  /* lobby */
  .lobby { width: min(440px, 100%); padding: 24px; display: grid; gap: 16px; }
  .lobby h2 { font-size: 15px; }
  .roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .roster li { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
  .roster li.open { color: var(--mute); }
  .roster li.open .av { background: transparent; border: 1px dashed var(--line); }

  /* playing cards */
  .pc { position: relative; width: var(--cw); aspect-ratio: 5 / 7; flex: none; padding: 0; font: inherit; color: var(--ink); background: var(--card);
        border: 1px solid var(--card-edge); border-radius: 8px; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / .12);
        transition: transform .15s var(--out), box-shadow .15s var(--out); }
  @media (hover: hover) and (pointer: fine) { .pc:hover:not(:disabled) { transform: translateY(-3px); } }
  .pc.red { color: var(--red); }
  .pc .ix { position: absolute; display: grid; justify-items: center; line-height: 1; font-family: var(--face); }
  .pc .ix b { font-weight: 700; font-size: calc(var(--cw) * .2); } .pc .ix i { font-style: normal; font-size: calc(var(--cw) * .16); }
  .pc .ix .crown { width: calc(var(--cw) * .2); height: calc(var(--cw) * .2); }
  .pc .tl { top: 6px; left: 7px; } .pc .br { bottom: 6px; right: 7px; rotate: 180deg; }
  .pc .face { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .44); padding-bottom: 22%; }
  .pc .face .crown { width: calc(var(--cw) * .5); height: calc(var(--cw) * .5); }
  .pc .role { position: absolute; left: 0; right: 0; bottom: 30%; font: 500 max(12px, calc(var(--cw) * .13)) var(--sans); }
  .pc .chips { position: absolute; left: 50%; bottom: -10px; translate: -50% 0; display: flex; gap: 4px; }
  .chip { font: 600 11px/1 var(--sans); padding: 4px 6px; border-radius: 99px; background: var(--ink); color: #fff; white-space: nowrap; }
  .chip.kill { background: var(--red); animation: bump .2s var(--out); }
  @keyframes bump { from { scale: 1.35; } }
  .pc.king { color: var(--gold-deep); border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 1px 2px rgb(0 0 0 / .12); }
  .pc.king .role { color: var(--gold-ink); }
  .pc.sel { transform: translateY(-6px); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sel); }
  .pc.gap { visibility: hidden; }
  .pc.ghost { background: transparent; border: 1px dashed var(--line); box-shadow: none; cursor: default; display: grid; place-items: center; align-content: center; color: var(--mute); font-size: 12px; font-weight: 600; }
  .pc.ghost.next { border: 2px solid var(--primary); color: var(--primary); }
  .pc.land { animation: land .2s var(--out); cursor: default; }
  .pc.land:hover { transform: none; }
  @keyframes land { from { opacity: 0; transform: translateY(-14px) scale(1.04); } }
  .pc.sm { --cw: 54px; border-radius: 6px; }
  .pc.sm .role { display: none; } .pc.sm .br { display: none; }
  .pc.sm .face { font-size: 24px; padding: 18% 0 0; } .pc.sm .face .crown { width: 24px; height: 24px; }
  .pc.sm .chips { gap: 2px; } .pc.sm .chip { padding: 2px 3px; }

  /* setup */
  .setup { display: grid; grid-template-rows: 1fr auto; gap: 20px; }
  .lay { display: grid; justify-items: center; align-content: center; gap: 16px; }
  .formation { display: grid; grid-template-columns: repeat(3, var(--cw)); gap: 24px 16px; padding: 24px; }
  .muck { display: flex; align-items: center; gap: 8px; }
  .muck .pc.land { opacity: .6; }
  .hand-tray { padding: 20px 16px 24px; display: grid; justify-items: center; gap: 16px; }
  .hand { display: flex; justify-content: center; gap: 0; min-height: calc(var(--cw) * 1.4); }
  .hand .pc { margin: 0 -6px; animation: deal .3s var(--out) backwards; animation-delay: calc(var(--i, 0) * 50ms); }
  @keyframes deal { from { opacity: 0; transform: translateY(-24px) scale(.95); } }
  .tray-actions { display: flex; gap: 12px; }

  /* play */
  .board { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-bottom: 20px; }
  .board > .opps { align-self: stretch; } .board > .mine { margin-top: auto; }
  .opps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 220px)); justify-content: center; gap: 16px; }
  .opp { padding: 12px; }
  .opp.out { opacity: .5; }
  .opp header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 15px; min-width: 0; }
  .opp header h2 { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
  .opp.turn { border-color: var(--primary); }
  .av { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--soft); color: var(--text); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .mini-grid { display: grid; grid-template-columns: repeat(3, 54px); gap: 16px 8px; justify-content: center; padding-bottom: 8px; }
  .dealer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; padding: 8px 8px 8px 16px; animation: pop2 .2s var(--out); }
  .dealer.alarm { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  @keyframes pop2 { from { opacity: 0; transform: scale(.96); } }
  .mine { padding: 24px 32px 28px; }
  .mine.turn { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .my-grid { display: grid; grid-template-columns: repeat(3, var(--cw)); gap: 24px 16px; --cw: 100px; }
  .moves { position: sticky; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); }
  .moves .hint { padding: 0 12px; color: var(--mute); font-size: 14px; }
  .drawer { position: fixed; top: 64px; right: 16px; bottom: 16px; width: min(340px, calc(100% - 32px)); z-index: 5; overflow: auto; overscroll-behavior: contain; padding: 20px; box-shadow: 0 12px 40px rgb(0 0 0 / .18); animation: slide .22s var(--out); }
  .drawer h2 { font-size: 15px; margin-bottom: 12px; }
  .drawer ol { margin: 0 0 16px; padding-left: 20px; font-size: 14px; display: grid; gap: 8px; }
  @keyframes slide { from { opacity: 0; transform: translateX(16px); } }

  /* open log: keep the board and move bar clear of the drawer */
  @media (min-width: 821px) { .board:has(> .drawer:not([hidden])) { padding-right: 360px; max-width: none; } }
  @media (max-width: 820px) {
    .newbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } .newbar .btn { grid-column: 1 / -1; }
    .opps { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  }
  @media (max-width: 560px) {
    .main { padding: 20px 16px; }
    .top { padding: 8px 12px; } .top .pill { display: none; } .top .btn { padding: 0 12px; }
    .opener h2 { font-size: 24px; }
    .board { padding: 16px 12px; }
    .opps { grid-template-columns: repeat(auto-fit, minmax(152px, 1fr)); gap: 8px; }
    .opp { padding: 8px 4px; } .mini-grid { grid-template-columns: repeat(3, 44px); gap: 12px 4px; } .pc.sm { --cw: 44px; } .pc.sm .face { font-size: 19px; }
    .mine { padding: 16px 8px 24px; } .my-grid { --cw: 84px; gap: 24px 12px; }
    .moves .hint { flex-basis: 100%; text-align: center; padding: 4px 0; }
    .hand { flex-wrap: wrap; row-gap: 20px; } .hand .pc { --cw: 72px; margin: 0 -4px; }
    .formation { --cw: 72px; gap: 16px 8px; padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="client.js"></script>
</body>
</html>
