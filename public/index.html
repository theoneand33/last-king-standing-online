<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last King Standing</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  .card { display: inline-block; min-width: 3.2em; padding: 6px; margin: 2px; border: 1px solid #888;
          border-radius: 4px; text-align: center; cursor: pointer; background: #f4f4f4; vertical-align: top; }
  .card.red { color: #b00; }
  .card.sel { outline: 3px solid #06c; }
  .card.empty { visibility: hidden; }
  .card small { display: block; color: #555; }
  .player { border: 1px solid #ccc; padding: 8px; margin: 8px 0; }
  .player.turn { border-color: #06c; }
  .player.out { opacity: .4; }
  #error { color: #b00; min-height: 1.2em; }
  button { margin: 2px; }
</style>
</head>
<body>
<h1>Last King Standing</h1>
<div id="error"></div>
<div id="app"></div>
<script src="client.js"></script>
</body>
</html>
